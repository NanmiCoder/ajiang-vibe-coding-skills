<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* 布局：上面是一台连续播放的放映机（N 段首尾相接），下面是本段镜头表和需要确认的事项；浅色配色由 preview_page.py 从 src/data/tokens.json 注入（/*__TOKENS__*/ 那一行） */
:root{
  /*__TOKENS__*/--bg:#F7F8FA; --surface:#FFFFFF; --ink:#20242C; --muted:#657080; --line:#E1E5EB; --blue:#345DE3; --pale:#EFF3FF; --amber:#9A6420; --amber-bg:#F7EEDF; --green:#247557;
  --shadow:0 1px 2px rgba(20,28,45,.06),0 18px 40px -20px rgba(25,40,90,.22);
  --sans:Geist,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1A1E26; --ink:#E8EBF1; --muted:#9AA3B2; --line:#2A303B;
  --blue:#7C9BFF; --pale:#1E2740; --amber:#E0B26A; --amber-bg:#2E2618; --green:#6FC59B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -20px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1A1E26; --ink:#E8EBF1; --muted:#9AA3B2; --line:#2A303B;
  --blue:#7C9BFF; --pale:#1E2740; --amber:#E0B26A; --amber-bg:#2E2618; --green:#6FC59B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -20px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;padding:28px 18px 64px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
header{display:grid;gap:10px}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 13px var(--mono);letter-spacing:.06em;color:var(--muted)}
.eyebrow i{width:9px;height:9px;border-radius:3px;background:var(--blue)}
h1{margin:0;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.lead{margin:0;max-width:70ch;color:var(--muted);font-size:15.5px}
.player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.screen video{display:block;width:100%;aspect-ratio:16/9;background:#0E1116}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.bar .now{font-weight:600;font-size:15px;min-width:0}
.bar .now small{font:500 12px var(--mono);color:var(--muted);margin-right:8px}
.bar .sp{flex:1}
.btn{all:unset;cursor:pointer;font:500 13px var(--sans);padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:focus-visible,.seg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.list{display:grid;gap:6px}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid transparent;font-size:14px}
.seg:hover{background:var(--surface);border-color:var(--line)}
.seg.on{background:var(--surface);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.seg b{font:500 12px var(--mono);color:var(--muted)}
.seg.on b{color:var(--blue)}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.seg em{font:normal 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.card h2{margin:0 0 4px;font-size:18px;font-weight:600}
.card .meta{font:12px var(--mono);color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
.beats{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.beats li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:14.5px}
.beats li time{font:12.5px var(--mono);color:var(--blue);padding-top:2px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:500 11.5px var(--mono);padding:1px 8px;border-radius:999px;background:var(--pale);color:var(--blue);margin-left:6px;white-space:nowrap}
.ask h2{margin-bottom:12px}
.ask ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14.5px}
.ask li::marker{color:var(--amber);font-weight:600}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.notes div{font-size:14px;color:var(--muted)}
.notes b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:860px){.player,.detail{grid-template-columns:minmax(0,1fr)}.list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow"><i></i><span id="eyebrow"></span></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <section class="player" aria-label="分段预览">
    <div class="screen">
      <video id="v" controls playsinline preload="metadata"></video>
      <div class="bar">
        <div class="now" id="now"></div>
        <div class="sp"></div>
        <button class="btn" id="auto" aria-pressed="true" type="button">连续播放</button>
      </div>
    </div>
    <nav class="list" id="list" aria-label="段落"></nav>
  </section>

  <section class="detail">
    <article class="card" id="beats"></article>
    <article class="card ask">
      <h2>需要你看一眼的地方</h2>
      <ol id="asks"></ol>
    </article>
  </section>

  <section class="card">
    <div class="notes" id="notes"></div>
  </section>
</div>

<script>
const DATA = /*__DATA__*/{};
const SEGS = DATA.segs || [];
document.getElementById('eyebrow').textContent = DATA.eyebrow || '';
document.getElementById('h1').innerHTML = DATA.h1 || '';
document.getElementById('lead').textContent = DATA.lead || '';
document.getElementById('asks').innerHTML = (DATA.asks || []).map(x => `<li>${x}</li>`).join('');
document.getElementById('notes').innerHTML = (DATA.notes || []).map(x => `<div><b>${x[0]}</b>${x[1]}</div>`).join('');
const v = document.getElementById('v'), list = document.getElementById('list'), now = document.getElementById('now'), beats = document.getElementById('beats'), auto = document.getElementById('auto');
let cur = 0, autoOn = true;
try { const s = localStorage.getItem('koubo-broll-auto'); if (s === '0') autoOn = false; } catch (e) {}
auto.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
SEGS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'seg'; b.type = 'button';
  b.innerHTML = `<b>${String(i).padStart(2, '0')}</b><span>${s.t}</span><em>${s.s.toFixed(1)}s</em>`;
  b.addEventListener('click', () => show(i, true));
  list.appendChild(b);
});
function show(i, play) {
  cur = i; const s = SEGS[i];
  [...list.children].forEach((b, j) => b.classList.toggle('on', j === i));
  v.src = `v/${s.k}.mp4`;
  now.innerHTML = `<small>${s.k}</small>${s.t}`;
  beats.innerHTML = `<h2>${s.t}</h2><div class="meta">成片区间 ${s.d} · ${s.s.toFixed(1)} 秒</div><ul class="beats">${s.beats.map(b => `<li><time>${b[0]}</time><div>${b[1]}</div></li>`).join('')}</ul>`;
  if (play) v.play().catch(() => {});
}
v.addEventListener('ended', () => { if (autoOn && cur < SEGS.length - 1) show(cur + 1, true); });
auto.addEventListener('click', () => {
  autoOn = !autoOn; auto.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
  try { localStorage.setItem('koubo-broll-auto', autoOn ? '1' : '0'); } catch (e) {}
});
show(0, false);
</script>
